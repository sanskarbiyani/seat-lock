services:
  postgres:
    image: postgres:17
    container_name: seatlock-postgres
    environment:
      POSTGRES_DB: seatlock
      POSTGRES_USER: seatlock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatlock -d seatlock"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: SeatLock.Api/Dockerfile
    container_name: seatlock-api
    ports:
      - "8080:8080"
    environment:
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=seatlock;Username=seatlock;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
  
  prometheus:
    image: prom/prometheus:latest
    container_name: seatlock-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: seatlock-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data: