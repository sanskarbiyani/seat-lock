services:
  postgres:
    image: postgres:17
    container_name: seatlock-postgres
    environment:
      POSTGRES_DB: seatlock
      POSTGRES_USER: seatlock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatlock -d seatlock"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: SeatLock.Api/Dockerfile
    container_name: seatlock-api
    ports:
      - "8080:8080"
    environment:
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=seatlock;Username=seatlock;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: